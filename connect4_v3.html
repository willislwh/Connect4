<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4: Shifted Origin Edition</title>
    <style>
        :root {
            --board-color: #2a52be;
            --empty-color: #1a1a1a;
            --player1-color: #ff3b3b;
            --player2-color: #f9d71c;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { color: #333; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; font-style: italic; }

        /* Game Layout */
        .game-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* The Board */
        .board-outer {
            padding: 15px;
            background-color: var(--board-color);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 10px;
        }

        .cell {
            width: 60px;
            height: 60px;
            background-color: var(--empty-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.5);
            position: relative;
        }

        .token {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .token.p1 { background-color: var(--player1-color); box-shadow: 0 4px #b30000; }
        .token.p2 { background-color: var(--player2-color); box-shadow: 0 4px #bfa300; }

        /* Axis Labels */
        .axis-label-x {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            gap: 10px;
            margin-top: 10px;
            margin-left: 15px; /* align with board inner padding */
            text-align: center;
            font-weight: bold;
            color: var(--board-color);
        }

        .y-axis {
            position: absolute;
            left: -35px;
            top: 15px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            height: 410px;
            font-weight: bold;
            color: var(--board-color);
        }

        /* Controls */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }

        .status-box {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .p1-turn { background-color: var(--player1-color); color: white; }
        .p2-turn { background-color: var(--player2-color); color: black; }

        .input-group {
            margin-bottom: 15px;
        }

        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-reset { background-color: #95a5a6; color: white; }

        /* Log */
        .log-container {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            font-size: 0.85rem;
        }

        .log-entry { margin-bottom: 5px; border-left: 3px solid #ddd; padding-left: 8px; }
        .penalty { color: #e74c3c; font-weight: bold; border-color: #e74c3c; }
    </style>
</head>
<body>

    <h1>Connect 4: Offset Gravity</h1>
    <div class="subtitle">Bottom-Left Origin is (-3, -2)</div>
    
    <div class="game-container">
        <div style="position: relative;">
            <div class="y-axis">
                <span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span><span>3</span>
            </div>
            <div class="board-outer">
                <div class="grid" id="grid">
                    </div>
            </div>
            <div class="axis-label-x">
                <span>-3</span><span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span><span>3</span>
            </div>
        </div>

        <div class="controls">
            <div id="status" class="status-box p1-turn">Player 1's Turn (Red)</div>
            
            <div class="input-group">
                <label>X Coordinate (-3 to 3):</label>
                <input type="number" id="inputX" min="-3" max="3" placeholder="Column">
            </div>
            
            <div class="input-group">
                <label>Y Coordinate (-2 to 3):</label>
                <input type="number" id="inputY" min="-2" max="3" placeholder="Row">
            </div>

            <button class="btn-submit" onclick="makeMove()">Submit Move</button>
            <button class="btn-reset" onclick="resetGame()">Reset Game</button>

            <div class="log-container" id="log">
                <div class="log-entry">Game started. Origin is at (-3, -2).</div>
            </div>
        </div>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        const OFFSET_X = 3; // Shift X by +3 to map [-3, 3] to [0, 6]
        const OFFSET_Y = 2; // Shift Y by +2 to map [-2, 3] to [0, 5]

        let board = [];
        let currentPlayer = 1;
        let gameOver = false;

        function initBoard() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            
            // We create cells from top visual row down to bottom visual row
            for (let r = ROWS - 1; r >= 0; r--) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${c}-${r}`; // Use internal indices for DOM ID
                    gridElement.appendChild(cell);
                }
            }
        }

        function addLog(msg, isPenalty = false) {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = isPenalty ? 'log-entry penalty' : 'log-entry';
            entry.innerText = msg;
            log.prepend(entry);
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            const status = document.getElementById('status');
            status.innerText = `Player ${currentPlayer}'s Turn (${currentPlayer === 1 ? 'Red' : 'Yellow'})`;
            status.className = `status-box ${currentPlayer === 1 ? 'p1-turn' : 'p2-turn'}`;
        }

        function checkWin(c, r) {
            const player = board[r][c];
            const directions = [
                [[0, 1], [0, -1]],  // Vertical
                [[1, 0], [-1, 0]],  // Horizontal
                [[1, 1], [-1, -1]], // Diagonal /
                [[1, -1], [-1, 1]]  // Diagonal \
            ];

            for (let dir of directions) {
                let count = 1;
                for (let [dx, dy] of dir) {
                    let nc = c + dx;
                    let nr = r + dy;
                    while (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && board[nr][nc] === player) {
                        count++;
                        nc += dx;
                        nr += dy;
                    }
                }
                if (count >= 4) return true;
            }
            return false;
        }

        function makeMove() {
            if (gameOver) return;

            const userX = parseInt(document.getElementById('inputX').value);
            const userY = parseInt(document.getElementById('inputY').value);

            // 1. Check Bounds based on new user coordinate system
            if (isNaN(userX) || isNaN(userY) || userX < -3 || userX > 3 || userY < -2 || userY > 3) {
                addLog(`P${currentPlayer}: Invalid Coordinates (${userX},${userY}). Turn lost!`, true);
                switchPlayer();
                return;
            }

            // Map user coordinates to internal array indices
            const c = userX + OFFSET_X;
            const r = userY + OFFSET_Y;

            // 2. Check Occupancy
            if (board[r][c] !== 0) {
                addLog(`P${currentPlayer}: Slot (${userX},${userY}) is taken. Turn lost!`, true);
                switchPlayer();
                return;
            }

            // 3. Gravity Rule Check
            // A piece must be at userY = -2 (which is internal r = 0) OR have a piece directly below it
            const hasSupport = (userY === -2) || (board[r - 1][c] !== 0);
            if (!hasSupport) {
                addLog(`P${currentPlayer}: Gravity Violation at (${userX},${userY})! Turn lost!`, true);
                switchPlayer();
                return;
            }

            // 4. Valid Move
            board[r][c] = currentPlayer;
            const cell = document.getElementById(`cell-${c}-${r}`);
            const token = document.createElement('div');
            token.className = `token ${currentPlayer === 1 ? 'p1' : 'p2'}`;
            cell.appendChild(token);
            
            addLog(`P${currentPlayer} placed at (${userX},${userY})`);

            if (checkWin(c, r)) {
                document.getElementById('status').innerText = `PLAYER ${currentPlayer} WINS!`;
                document.getElementById('status').style.backgroundColor = "#27ae60";
                document.getElementById('status').style.color = "white";
                gameOver = true;
                addLog(`GAME OVER - Player ${currentPlayer} won!`);
                return;
            }

            switchPlayer();
        }

        function resetGame() {
            currentPlayer = 1;
            gameOver = false;
            document.getElementById('inputX').value = '';
            document.getElementById('inputY').value = '';
            document.getElementById('log').innerHTML = '<div class="log-entry">Game Reset. Origin is (-3, -2).</div>';
            const status = document.getElementById('status');
            status.innerText = "Player 1's Turn (Red)";
            status.className = "status-box p1-turn";
            initBoard();
        }

        // Initialize on load
        initBoard();
    </script>
</body>
</html>
